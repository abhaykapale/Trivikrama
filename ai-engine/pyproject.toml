[project]
name = "trivikrama-ai-engine"
version = "0.1.0"
description = "Stateless ML inference service for Trivikrama"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.10,<3.0",
    "scikit-learn>=1.5,<2.0",
    "shap>=0.47,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
training = [
    "pymongo>=4.10,<5.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib", "shap", "sklearn", "sklearn.*"]
ignore_missing_imports = true
