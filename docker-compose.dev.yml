services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: trivikrama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trivikrama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abhay@287
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trivikrama"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trivikrama-dev

  mongodb-dev:
    image: mongo:7
    container_name: trivikrama-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: siem_events
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trivikrama-dev

  redis-dev:
    image: redis:7-alpine
    container_name: trivikrama-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trivikrama-dev

volumes:
  postgres_dev_data:
  mongodb_dev_data:
  redis_dev_data:

networks:
  trivikrama-dev:
    driver: bridge
